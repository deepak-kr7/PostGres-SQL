# ==============================================================================
# Azure DevOps DevSecOps Pipeline:
# Security: Gitleaks (Secrets) + tfsec (Vulnerabilities) + Checkov (Compliance)
# Cost: Azure Infrastructure Monthly Budget Estimator
# Lifecycle: Security & Cost Scan -> Terraform Plan -> Manual Approval -> Apply
# Organization: pipelineagentic
# Project: Axion_project (https://dev.azure.com/pipelineagentic/Axion_project)
# Service Connection: Axion project
# Agent Pool: Microsoft-hosted (ubuntu-latest)
# Backend: Azure Blob Storage (Demo_rg_A / demostgab / democontainer)
# ==============================================================================

trigger: none
pr: none

parameters:
  - name: environment
    displayName: "Select Target Environment"
    type: string
    default: "dev"
    values:
      - dev
      - qa
      - prod

variables:
  serviceConnection: "Axion project"
  backendRG: "Demo_rg_A"
  backendStorage: "demostgab"
  backendContainer: "democontainer"
  workingDirectory: "$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}"

stages:
  # ============================================================================
  # STAGE 1: SECURITY SCAN, COST ESTIMATION & TERRAFORM PLAN
  # ============================================================================
  - stage: ScanAndPlan
    displayName: "Security, Cost & Plan [${{ parameters.environment }}]"
    pool:
      vmImage: "ubuntu-latest"
    jobs:
      - job: SecurityCostAndPlan
        displayName: "Run Scans, Cost Breakdown & Plan"
        steps:
          # 1. Install Terraform CLI
          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: "latest"

          # --------------------------------------------------------------------
          # SECURITY TOOL 1: GITLEAKS (Secret & Credential Detection)
          # --------------------------------------------------------------------
          - bash: |
              echo "=========================================================="
              echo " [1/4] GITLEAKS: Secret & Password Leak Detection"
              echo "=========================================================="
              curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
              chmod +x /tmp/gitleaks

              echo "==> Scanning entire repository for leaked credentials, secrets & keys..."
              /tmp/gitleaks detect --source="$(System.DefaultWorkingDirectory)" --no-git --verbose || true
              echo "==> Gitleaks scan completed."
            displayName: "Security Tool 1: Gitleaks (Secret Detection)"

          # --------------------------------------------------------------------
          # SECURITY TOOL 2: TFSEC (Terraform Cloud Vulnerability Scanner)
          # --------------------------------------------------------------------
          - bash: |
              echo "=========================================================="
              echo " [2/4] TFSEC: Azure Infrastructure Security Scan"
              echo "=========================================================="
              curl -sSL https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64 -o /tmp/tfsec
              chmod +x /tmp/tfsec

              echo "==> Scanning all modules and environments with --force-all-dirs..."
              /tmp/tfsec $(System.DefaultWorkingDirectory) --force-all-dirs --soft-fail || true
            displayName: "Security Tool 2: tfsec (Vulnerability Scan)"

          # --------------------------------------------------------------------
          # SECURITY TOOL 3: CHECKOV (CIS Benchmarks & Policy Scanner)
          # --------------------------------------------------------------------
          - bash: |
              echo "=========================================================="
              echo " [3/4] CHECKOV: Policy & Compliance Security Audit"
              echo "=========================================================="
              pip install --quiet checkov
              echo "==> Running Checkov on Terraform modules and environments..."
              checkov -d $(System.DefaultWorkingDirectory) --framework terraform --soft-fail --output cli || true
            displayName: "Security Tool 3: Checkov (Compliance & CIS Audit)"

          # --------------------------------------------------------------------
          # COST TOOL 4: AZURE INFRASTRUCTURE COST ESTIMATION
          # --------------------------------------------------------------------
          - bash: |
              echo "=========================================================="
              echo " [4/4] COST ESTIMATION: Azure Monthly Budget Breakdown"
              echo "=========================================================="
              python3 scripts/cost_estimator.py $(workingDirectory)
            displayName: "Cost Tool: Azure Monthly Cost Estimation"

          # --------------------------------------------------------------------
          # TERRAFORM INIT, VALIDATE & PLAN
          # --------------------------------------------------------------------
          - task: TerraformTaskV4@4
            displayName: "Terraform Init"
            inputs:
              provider: "azurerm"
              command: "init"
              workingDirectory: "$(workingDirectory)"
              backendServiceArm: "${{ variables.serviceConnection }}"
              backendAzureRmResourceGroupName: "$(backendRG)"
              backendAzureRmStorageAccountName: "$(backendStorage)"
              backendAzureRmContainerName: "$(backendContainer)"
              backendAzureRmKey: "${{ parameters.environment }}.terraform.tfstate"

          - task: TerraformTaskV4@4
            displayName: "Terraform Validate"
            inputs:
              provider: "azurerm"
              command: "validate"
              workingDirectory: "$(workingDirectory)"

          - task: TerraformTaskV4@4
            displayName: "Terraform Plan"
            inputs:
              provider: "azurerm"
              command: "plan"
              workingDirectory: "$(workingDirectory)"
              environmentServiceNameAzureRM: "${{ variables.serviceConnection }}"
              commandOptions: "-var-file=terraform.tfvars"

  # ============================================================================
  # STAGE 2: MANUAL APPROVAL (Apply se pehle Security aur Cost Review)
  # ============================================================================
  - stage: Approval
    displayName: "Manual Approval [${{ parameters.environment }}]"
    dependsOn: ScanAndPlan
    jobs:
      - job: WaitForApproval
        displayName: "Wait for Manual Approval"
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualValidation@0
            displayName: "Approve Apply for ${{ parameters.environment }}"
            timeoutInMinutes: 1440
            inputs:
              instructions: "Please review the Gitleaks secrets report, tfsec & Checkov security findings, Azure monthly cost breakdown, and Terraform Plan logs in Stage 1. Click 'Resume' to approve deployment to ${{ parameters.environment }} or 'Reject' to cancel."

  # ============================================================================
  # STAGE 3: TERRAFORM APPLY
  # ============================================================================
  - stage: Apply
    displayName: "Terraform Apply [${{ parameters.environment }}]"
    dependsOn: Approval
    pool:
      vmImage: "ubuntu-latest"
    jobs:
      - job: TerraformApply
        displayName: "Run Terraform Apply"
        steps:
          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: "latest"

          - task: TerraformTaskV4@4
            displayName: "Terraform Init"
            inputs:
              provider: "azurerm"
              command: "init"
              workingDirectory: "$(workingDirectory)"
              backendServiceArm: "${{ variables.serviceConnection }}"
              backendAzureRmResourceGroupName: "$(backendRG)"
              backendAzureRmStorageAccountName: "$(backendStorage)"
              backendAzureRmContainerName: "$(backendContainer)"
              backendAzureRmKey: "${{ parameters.environment }}.terraform.tfstate"

          - task: TerraformTaskV4@4
            displayName: "Terraform Apply"
            inputs:
              provider: "azurerm"
              command: "apply"
              workingDirectory: "$(workingDirectory)"
              environmentServiceNameAzureRM: "${{ variables.serviceConnection }}"
              commandOptions: "-var-file=terraform.tfvars"
