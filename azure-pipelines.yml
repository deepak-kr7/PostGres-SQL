# ==============================================================================
# Azure DevOps Pipeline: Security Scan -> Terraform Plan -> Approval -> Apply
# Organization: pipelineagentic
# Project: Axion_project (https://dev.azure.com/pipelineagentic/Axion_project)
# Service Connection: Axion project
# Agent Pool: Microsoft-hosted (ubuntu-latest)
# Backend: Azure Blob Storage (Demo_rg_A / demostgab / democontainer)
# ==============================================================================

trigger: none
pr: none

# Parameter: Sirf Environment select karne ke liye (Command parameter hata diya hai)
parameters:
  - name: environment
    displayName: "Select Target Environment"
    type: string
    default: "dev"
    values:
      - dev
      - qa
      - prod

variables:
  serviceConnection: "Axion project"
  backendRG: "Demo_rg_A"
  backendStorage: "demostgab"
  backendContainer: "democontainer"
  workingDirectory: "$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}"

stages:
  # ============================================================================
  # STAGE 1: SECURITY SCAN & TERRAFORM PLAN
  # ============================================================================
  - stage: Plan
    displayName: "Security Scan & Plan [${{ parameters.environment }}]"
    pool:
      vmImage: "ubuntu-latest"
    jobs:
      - job: SecurityAndPlan
        displayName: "Run Security Scan & Terraform Plan"
        steps:
          # 1. Install Terraform CLI
          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: "latest"

          # 2. Security Tool: tfsec (Terraform Security Scanner)
          - bash: |
              echo "==> Installing tfsec security scanner..."
              curl -sSL https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64 -o /tmp/tfsec
              chmod +x /tmp/tfsec
              echo "==> Running security scan on $(workingDirectory)..."
              /tmp/tfsec $(workingDirectory) --soft-fail
            displayName: "Security Scan (tfsec)"

          # 3. Terraform Init (AzureRM Backend)
          - task: TerraformTaskV4@4
            displayName: "Terraform Init"
            inputs:
              provider: "azurerm"
              command: "init"
              workingDirectory: "$(workingDirectory)"
              backendServiceArm: "${{ variables.serviceConnection }}"
              backendAzureRmResourceGroupName: "$(backendRG)"
              backendAzureRmStorageAccountName: "$(backendStorage)"
              backendAzureRmContainerName: "$(backendContainer)"
              backendAzureRmKey: "${{ parameters.environment }}.terraform.tfstate"

          # 4. Terraform Validate
          - task: TerraformTaskV4@4
            displayName: "Terraform Validate"
            inputs:
              provider: "azurerm"
              command: "validate"
              workingDirectory: "$(workingDirectory)"

          # 5. Terraform Plan
          - task: TerraformTaskV4@4
            displayName: "Terraform Plan"
            inputs:
              provider: "azurerm"
              command: "plan"
              workingDirectory: "$(workingDirectory)"
              environmentServiceNameAzureRM: "${{ variables.serviceConnection }}"
              commandOptions: "-var-file=terraform.tfvars"

  # ============================================================================
  # STAGE 2: MANUAL APPROVAL (Apply karne se pehle review & approval)
  # ============================================================================
  - stage: Approval
    displayName: "Manual Approval [${{ parameters.environment }}]"
    dependsOn: Plan
    jobs:
      - job: WaitForApproval
        displayName: "Wait for Manual Approval"
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualValidation@0
            displayName: "Approve Apply for ${{ parameters.environment }}"
            timeoutInMinutes: 1440
            inputs:
              instructions: "Please review the Security Scan (tfsec) results and Terraform Plan logs in Stage 1. Click 'Resume' to approve Apply or 'Reject' to abort."

  # ============================================================================
  # STAGE 3: TERRAFORM APPLY (Approval milne ke baad execute hoga)
  # ============================================================================
  - stage: Apply
    displayName: "Terraform Apply [${{ parameters.environment }}]"
    dependsOn: Approval
    pool:
      vmImage: "ubuntu-latest"
    jobs:
      - job: TerraformApply
        displayName: "Run Terraform Apply"
        steps:
          # 1. Install Terraform CLI
          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: "latest"

          # 2. Terraform Init
          - task: TerraformTaskV4@4
            displayName: "Terraform Init"
            inputs:
              provider: "azurerm"
              command: "init"
              workingDirectory: "$(workingDirectory)"
              backendServiceArm: "${{ variables.serviceConnection }}"
              backendAzureRmResourceGroupName: "$(backendRG)"
              backendAzureRmStorageAccountName: "$(backendStorage)"
              backendAzureRmContainerName: "$(backendContainer)"
              backendAzureRmKey: "${{ parameters.environment }}.terraform.tfstate"

          # 3. Terraform Apply
          - task: TerraformTaskV4@4
            displayName: "Terraform Apply"
            inputs:
              provider: "azurerm"
              command: "apply"
              workingDirectory: "$(workingDirectory)"
              environmentServiceNameAzureRM: "${{ variables.serviceConnection }}"
              commandOptions: "-var-file=terraform.tfvars"
