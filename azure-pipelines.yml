# ==============================================================================
# Azure DevOps DevSecOps Pipeline:
# Tools: Gitleaks (Secrets) + tfsec (Security) + TFLint (Linter) + Infracost (Cost)
# Lifecycle: Quality & Security Scan -> Plan -> Manual Approval -> Apply
# Organization: pipelineagentic
# Project: Axion_project (https://dev.azure.com/pipelineagentic/Axion_project)
# Service Connection: Axion project
# Agent Pool: Microsoft-hosted (ubuntu-latest)
# Backend: Azure Blob Storage (Demo_rg_A / demostgab / democontainer)
# ==============================================================================

trigger: none
pr: none

parameters:
  - name: environment
    displayName: "Select Target Environment"
    type: string
    default: "dev"
    values:
      - dev
      - qa
      - prod

variables:
  serviceConnection: "Axion project"
  backendRG: "Demo_rg_A"
  backendStorage: "demostgab"
  backendContainer: "democontainer"
  workingDirectory: "$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}"

stages:
  # ============================================================================
  # STAGE 1: DEVSECOPS CHECKS, COST ESTIMATION & TERRAFORM PLAN
  # ============================================================================
  - stage: ScanAndPlan
    displayName: "Security, Cost & Plan [${{ parameters.environment }}]"
    pool:
      vmImage: "ubuntu-latest"
    jobs:
      - job: SecurityCostAndPlan
        displayName: "Run Scans, Cost Estimate & Plan"
        steps:
          # 1. Install Terraform CLI
          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: "latest"

          # --------------------------------------------------------------------
          # SECURITY TOOL 1: GITLEAKS (Secret & Credential Detection)
          # --------------------------------------------------------------------
          - bash: |
              echo "=========================================================="
              echo " ==> Installing Gitleaks (Secret Detection Tool)..."
              echo "=========================================================="
              curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
              chmod +x /tmp/gitleaks

              echo "==> Scanning repository for passwords, API tokens & secrets..."
              /tmp/gitleaks detect --source="$(System.DefaultWorkingDirectory)" --no-git --verbose || true
            displayName: "Security Tool: Gitleaks (Secret Detection)"

          # --------------------------------------------------------------------
          # SECURITY TOOL 2: TFSEC (Terraform Static Security Scanner)
          # --------------------------------------------------------------------
          - bash: |
              echo "=========================================================="
              echo " ==> Installing tfsec (Terraform Security Scanner)..."
              echo "=========================================================="
              curl -sSL https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64 -o /tmp/tfsec
              chmod +x /tmp/tfsec

              echo "==> Scanning Terraform code for cloud vulnerabilities..."
              /tmp/tfsec $(workingDirectory) --soft-fail
            displayName: "Security Tool: tfsec (Vulnerability Scan)"

          # --------------------------------------------------------------------
          # QUALITY TOOL 3: TFLINT (Terraform Best Practices Linter)
          # --------------------------------------------------------------------
          - bash: |
              echo "=========================================================="
              echo " ==> Installing TFLint (Best Practices Linter)..."
              echo "=========================================================="
              curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash

              echo "==> Running TFLint on $(workingDirectory)..."
              tflint --chdir=$(workingDirectory) || true
            displayName: "Quality Tool: TFLint (Code Linter)"

          # --------------------------------------------------------------------
          # COST TOOL 4: INFRACOST (Cloud Infrastructure Cost Estimator)
          # --------------------------------------------------------------------
          - bash: |
              echo "=========================================================="
              echo " ==> Installing Infracost (Cloud Cost Estimator)..."
              echo "=========================================================="
              curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh

              echo "==> Estimating Azure monthly infrastructure costs..."
              # Note: If you have an Infracost API key, add INFRACOST_API_KEY to pipeline variables
              infracost breakdown --path=$(workingDirectory) --format=table || true
            displayName: "Cost Tool: Infracost (Monthly Cost Estimation)"

          # --------------------------------------------------------------------
          # TERRAFORM INIT, VALIDATE & PLAN
          # --------------------------------------------------------------------
          - task: TerraformTaskV4@4
            displayName: "Terraform Init"
            inputs:
              provider: "azurerm"
              command: "init"
              workingDirectory: "$(workingDirectory)"
              backendServiceArm: "${{ variables.serviceConnection }}"
              backendAzureRmResourceGroupName: "$(backendRG)"
              backendAzureRmStorageAccountName: "$(backendStorage)"
              backendAzureRmContainerName: "$(backendContainer)"
              backendAzureRmKey: "${{ parameters.environment }}.terraform.tfstate"

          - task: TerraformTaskV4@4
            displayName: "Terraform Validate"
            inputs:
              provider: "azurerm"
              command: "validate"
              workingDirectory: "$(workingDirectory)"

          - task: TerraformTaskV4@4
            displayName: "Terraform Plan"
            inputs:
              provider: "azurerm"
              command: "plan"
              workingDirectory: "$(workingDirectory)"
              environmentServiceNameAzureRM: "${{ variables.serviceConnection }}"
              commandOptions: "-var-file=terraform.tfvars"

  # ============================================================================
  # STAGE 2: MANUAL APPROVAL (Apply karne se pehle review & approval)
  # ============================================================================
  - stage: Approval
    displayName: "Manual Approval [${{ parameters.environment }}]"
    dependsOn: ScanAndPlan
    jobs:
      - job: WaitForApproval
        displayName: "Wait for Manual Approval"
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualValidation@0
            displayName: "Approve Apply for ${{ parameters.environment }}"
            timeoutInMinutes: 1440
            inputs:
              instructions: "Please review the Gitleaks secrets report, tfsec security scan, Infracost budget estimates, and Terraform Plan logs in Stage 1. Click 'Resume' to approve deployment to ${{ parameters.environment }} or 'Reject' to cancel."

  # ============================================================================
  # STAGE 3: TERRAFORM APPLY (Approval milne ke baad execute hoga)
  # ============================================================================
  - stage: Apply
    displayName: "Terraform Apply [${{ parameters.environment }}]"
    dependsOn: Approval
    pool:
      vmImage: "ubuntu-latest"
    jobs:
      - job: TerraformApply
        displayName: "Run Terraform Apply"
        steps:
          # 1. Install Terraform CLI
          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: "latest"

          # 2. Terraform Init
          - task: TerraformTaskV4@4
            displayName: "Terraform Init"
            inputs:
              provider: "azurerm"
              command: "init"
              workingDirectory: "$(workingDirectory)"
              backendServiceArm: "${{ variables.serviceConnection }}"
              backendAzureRmResourceGroupName: "$(backendRG)"
              backendAzureRmStorageAccountName: "$(backendStorage)"
              backendAzureRmContainerName: "$(backendContainer)"
              backendAzureRmKey: "${{ parameters.environment }}.terraform.tfstate"

          # 3. Terraform Apply
          - task: TerraformTaskV4@4
            displayName: "Terraform Apply"
            inputs:
              provider: "azurerm"
              command: "apply"
              workingDirectory: "$(workingDirectory)"
              environmentServiceNameAzureRM: "${{ variables.serviceConnection }}"
              commandOptions: "-var-file=terraform.tfvars"
