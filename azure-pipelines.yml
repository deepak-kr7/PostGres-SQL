# ==============================================================================
# Azure DevOps Pipeline (Task Assistant Format with Manual Approval)
# Organization: pipelineagentic
# Project: Axion_project (https://dev.azure.com/pipelineagentic/Axion_project)
# Service Connection: Axion project
# Agent Pool: Microsoft-hosted (ubuntu-latest)
# Backend: Azure Blob Storage (Demo_rg_A / demostgab / democontainer)
# ==============================================================================

trigger: none
pr: none

parameters:
  - name: environment
    displayName: "Select Target Environment"
    type: string
    default: "dev"
    values:
      - dev
      - qa
      - prod

  - name: action
    displayName: "Select Terraform Action"
    type: string
    default: "plan"
    values:
      - plan
      - apply
      - destroy

variables:
  serviceConnection: "Axion project"
  backendRG: "Demo_rg_A"
  backendStorage: "demostgab"
  backendContainer: "democontainer"
  workingDirectory: "$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}"

stages:
  # ============================================================================
  # STAGE 1: PLAN (Init, Validate, Plan)
  # ============================================================================
  - stage: Plan
    displayName: "Terraform Plan [${{ parameters.environment }}]"
    pool:
      vmImage: "ubuntu-latest"
    jobs:
      - job: TerraformPlan
        displayName: "Run Plan"
        steps:
          # 1. Install Terraform
          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: "latest"

          # 2. Terraform Init
          - task: TerraformTaskV4@4
            displayName: "Terraform Init"
            inputs:
              provider: "azurerm"
              command: "init"
              workingDirectory: "$(workingDirectory)"
              backendServiceArm: "${{ variables.serviceConnection }}"
              backendAzureRmResourceGroupName: "$(backendRG)"
              backendAzureRmStorageAccountName: "$(backendStorage)"
              backendAzureRmContainerName: "$(backendContainer)"
              backendAzureRmKey: "${{ parameters.environment }}.terraform.tfstate"

          # 3. Terraform Validate
          - task: TerraformTaskV4@4
            displayName: "Terraform Validate"
            inputs:
              provider: "azurerm"
              command: "validate"
              workingDirectory: "$(workingDirectory)"

          # 4. Terraform Plan (Normal)
          - task: TerraformTaskV4@4
            displayName: "Terraform Plan"
            condition: and(succeeded(), ne('${{ parameters.action }}', 'destroy'))
            inputs:
              provider: "azurerm"
              command: "plan"
              workingDirectory: "$(workingDirectory)"
              environmentServiceNameAzureRM: "${{ variables.serviceConnection }}"
              commandOptions: "-var-file=terraform.tfvars"

          # 4. Terraform Plan (Destroy plan agar action destroy ho)
          - task: TerraformTaskV4@4
            displayName: "Terraform Plan (Destroy)"
            condition: and(succeeded(), eq('${{ parameters.action }}', 'destroy'))
            inputs:
              provider: "azurerm"
              command: "plan"
              workingDirectory: "$(workingDirectory)"
              environmentServiceNameAzureRM: "${{ variables.serviceConnection }}"
              commandOptions: "-destroy -var-file=terraform.tfvars"

  # ============================================================================
  # STAGE 2: MANUAL APPROVAL (Sirf Apply ya Destroy hone par pause karega)
  # ============================================================================
  - stage: Approval
    displayName: "Manual Approval [${{ parameters.environment }}]"
    dependsOn: Plan
    condition: and(succeeded(), in('${{ parameters.action }}', 'apply', 'destroy'))
    jobs:
      - job: WaitForApproval
        displayName: "Wait for Manual Approval"
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualValidation@0
            displayName: "Approve Terraform ${{ parameters.action }}"
            timeoutInMinutes: 1440
            inputs:
              instructions: "Please review the Terraform Plan logs in Stage 1. Click 'Resume' to approve ${{ parameters.action }} or 'Reject' to cancel."

  # ============================================================================
  # STAGE 3: EXECUTE (Approval ke baad apply ya destroy chalega)
  # ============================================================================
  - stage: Execute
    displayName: "Terraform ${{ parameters.action }} [${{ parameters.environment }}]"
    dependsOn: Approval
    condition: and(succeeded(), in('${{ parameters.action }}', 'apply', 'destroy'))
    pool:
      vmImage: "ubuntu-latest"
    jobs:
      - job: TerraformExecute
        displayName: "Execute ${{ parameters.action }}"
        steps:
          # 1. Install Terraform
          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: "latest"

          # 2. Terraform Init
          - task: TerraformTaskV4@4
            displayName: "Terraform Init"
            inputs:
              provider: "azurerm"
              command: "init"
              workingDirectory: "$(workingDirectory)"
              backendServiceArm: "${{ variables.serviceConnection }}"
              backendAzureRmResourceGroupName: "$(backendRG)"
              backendAzureRmStorageAccountName: "$(backendStorage)"
              backendAzureRmContainerName: "$(backendContainer)"
              backendAzureRmKey: "${{ parameters.environment }}.terraform.tfstate"

          # 3. Terraform Apply
          - task: TerraformTaskV4@4
            displayName: "Terraform Apply"
            condition: and(succeeded(), eq('${{ parameters.action }}', 'apply'))
            inputs:
              provider: "azurerm"
              command: "apply"
              workingDirectory: "$(workingDirectory)"
              environmentServiceNameAzureRM: "${{ variables.serviceConnection }}"
              commandOptions: "-var-file=terraform.tfvars"

          # 4. Terraform Destroy
          - task: TerraformTaskV4@4
            displayName: "Terraform Destroy"
            condition: and(succeeded(), eq('${{ parameters.action }}', 'destroy'))
            inputs:
              provider: "azurerm"
              command: "destroy"
              workingDirectory: "$(workingDirectory)"
              environmentServiceNameAzureRM: "${{ variables.serviceConnection }}"
              commandOptions: "-var-file=terraform.tfvars"
