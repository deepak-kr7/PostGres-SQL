# ==============================================================================
# Azure DevOps DevSecOps Pipeline:
# Parameters: Environment (dev / qa / prod) + Action (apply / destroy)
# Security: Gitleaks (Secrets) + tfsec (Vulnerabilities) + Checkov (Compliance)
# Cost: Azure Infrastructure Monthly Budget Estimator
# Results: Native "Tests" Tab + "Pipeline Summary" Dashboard + Console Tables
# Organization: pipelineagentic
# Project: Axion_project (https://dev.azure.com/pipelineagentic/Axion_project)
# Service Connection: Axion project
# Agent Pool: Microsoft-hosted (ubuntu-latest)
# Backend: Azure Blob Storage (Demo_rg_A / demostgab / democontainer)
# ==============================================================================

trigger: none
pr: none

parameters:
  - name: environment
    displayName: "Select Target Environment"
    type: string
    default: "dev"
    values:
      - dev
      - qa
      - prod

  - name: action
    displayName: "Select Action (apply / destroy)"
    type: string
    default: "apply"
    values:
      - apply
      - destroy

variables:
  serviceConnection: "Axion project"
  backendRG: "Demo_rg_A"
  backendStorage: "demostgab"
  backendContainer: "democontainer"
  workingDirectory: "$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}"

stages:
  # ============================================================================
  # STAGE 1: SECURITY SCAN, COST ESTIMATION & TERRAFORM PLAN
  # ============================================================================
  - stage: ScanAndPlan
    displayName: "Security, Cost & Plan [${{ parameters.environment }} : ${{ parameters.action }}]"
    pool:
      vmImage: "ubuntu-latest"
    jobs:
      - job: SecurityCostAndPlan
        displayName: "Run Scans, Cost Breakdown & Plan"
        steps:
          # 1. Install Terraform CLI
          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: "latest"

          # --------------------------------------------------------------------
          # SECURITY TOOL 1: GITLEAKS (Secret & Credential Detection)
          # --------------------------------------------------------------------
          - bash: |
              echo "=========================================================="
              echo " [1/4] GITLEAKS: Secret & Password Leak Detection"
              echo "=========================================================="
              curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
              chmod +x /tmp/gitleaks

              echo "==> Scanning entire repository for leaked credentials, secrets & keys..."
              /tmp/gitleaks detect --source="$(System.DefaultWorkingDirectory)" --no-git --report-format json --report-path "$(System.DefaultWorkingDirectory)/gitleaks-report.json" --verbose || true

              REPORT="$(System.DefaultWorkingDirectory)/gitleaks-report.json"
              if [ -f "$REPORT" ] && [ -s "$REPORT" ] && [ "$(tr -d '[:space:]' < "$REPORT")" != "[]" ]; then
                echo "##vso[task.logissue type=warning]Gitleaks detected potential secret leaks in repository!"
                cat "$REPORT"
              else
                echo "SUCCESS: 0 secrets or passwords leaked in repository."
              fi
            displayName: "Security Tool 1: Gitleaks (Secret Detection)"

          # --------------------------------------------------------------------
          # SECURITY TOOL 2: TFSEC (Azure Cloud Vulnerability Scanner)
          # --------------------------------------------------------------------
          - bash: |
              echo "=========================================================="
              echo " [2/4] TFSEC: Azure Infrastructure Security Scan"
              echo "=========================================================="
              curl -sSL https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64 -o /tmp/tfsec
              chmod +x /tmp/tfsec

              echo "==> Generating JUnit XML & Console Security Report..."
              /tmp/tfsec $(System.DefaultWorkingDirectory) --force-all-dirs --format junit > "$(System.DefaultWorkingDirectory)/tfsec-junit.xml" 2>/dev/null || true
              /tmp/tfsec $(System.DefaultWorkingDirectory) --force-all-dirs --format table --soft-fail || true
            displayName: "Security Tool 2: tfsec (Vulnerability Scan)"

          # Publish tfsec security test results to Azure DevOps native "Tests" Tab
          - task: PublishTestResults@2
            displayName: "Publish Security Test Results (Tests Tab)"
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "$(System.DefaultWorkingDirectory)/tfsec-junit.xml"
              testRunTitle: "Terraform Security Scan (tfsec)"
            condition: always()

          # --------------------------------------------------------------------
          # SECURITY TOOL 3: CHECKOV (CIS Benchmarks & Policy Scanner)
          # --------------------------------------------------------------------
          - bash: |
              echo "=========================================================="
              echo " [3/4] CHECKOV: Policy & Compliance Security Audit"
              echo "=========================================================="
              pip install --quiet checkov
              echo "==> Running Checkov on all modules and environments..."
              checkov -d $(System.DefaultWorkingDirectory) --framework terraform --soft-fail --output cli || true
            displayName: "Security Tool 3: Checkov (Compliance & CIS Audit)"

          # --------------------------------------------------------------------
          # COST TOOL 4: AZURE INFRASTRUCTURE COST ESTIMATION & SUMMARY DASHBOARD
          # --------------------------------------------------------------------
          - bash: |
              echo "=========================================================="
              echo " [4/4] COST ESTIMATION: Azure Monthly Budget Breakdown"
              echo "=========================================================="
              python3 scripts/cost_estimator.py $(workingDirectory) "$(System.DefaultWorkingDirectory)/cost-report.md"

              # Build unified summary dashboard for Azure DevOps Overview Tab
              echo "## DevSecOps & Cost Summary Dashboard" > "$(System.DefaultWorkingDirectory)/DevSecOps-Report.md"
              echo "Target Environment: **${{ parameters.environment }}** | Action: **${{ parameters.action }}**" >> "$(System.DefaultWorkingDirectory)/DevSecOps-Report.md"
              echo "" >> "$(System.DefaultWorkingDirectory)/DevSecOps-Report.md"
              if [ -f "$(System.DefaultWorkingDirectory)/cost-report.md" ]; then
                cat "$(System.DefaultWorkingDirectory)/cost-report.md" >> "$(System.DefaultWorkingDirectory)/DevSecOps-Report.md"
              fi
              echo "" >> "$(System.DefaultWorkingDirectory)/DevSecOps-Report.md"
              echo "### Security Gates Summary" >> "$(System.DefaultWorkingDirectory)/DevSecOps-Report.md"
              echo "- **Gitleaks**: Secrets scan completed (see step logs for detected tokens)." >> "$(System.DefaultWorkingDirectory)/DevSecOps-Report.md"
              echo "- **tfsec**: Infrastructure security scan published to the native **Tests** tab." >> "$(System.DefaultWorkingDirectory)/DevSecOps-Report.md"
              echo "- **Checkov**: Azure CIS compliance audit completed." >> "$(System.DefaultWorkingDirectory)/DevSecOps-Report.md"
              echo "" >> "$(System.DefaultWorkingDirectory)/DevSecOps-Report.md"

              # Upload markdown dashboard directly to the Azure DevOps Pipeline Run Summary page
              echo "##vso[task.uploadsummary]$(System.DefaultWorkingDirectory)/DevSecOps-Report.md"
            displayName: "Cost Tool: Azure Monthly Cost Estimation & Summary"

          # --------------------------------------------------------------------
          # TERRAFORM INIT, VALIDATE & PLAN
          # --------------------------------------------------------------------
          - task: TerraformTaskV4@4
            displayName: "Terraform Init"
            inputs:
              provider: "azurerm"
              command: "init"
              workingDirectory: "$(workingDirectory)"
              backendServiceArm: "${{ variables.serviceConnection }}"
              backendAzureRmResourceGroupName: "$(backendRG)"
              backendAzureRmStorageAccountName: "$(backendStorage)"
              backendAzureRmContainerName: "$(backendContainer)"
              backendAzureRmKey: "${{ parameters.environment }}.terraform.tfstate"

          - task: TerraformTaskV4@4
            displayName: "Terraform Validate"
            inputs:
              provider: "azurerm"
              command: "validate"
              workingDirectory: "$(workingDirectory)"

          # Terraform Plan for APPLY
          - task: TerraformTaskV4@4
            displayName: "Terraform Plan (Apply)"
            condition: and(succeeded(), eq('${{ parameters.action }}', 'apply'))
            inputs:
              provider: "azurerm"
              command: "plan"
              workingDirectory: "$(workingDirectory)"
              environmentServiceNameAzureRM: "${{ variables.serviceConnection }}"
              commandOptions: "-var-file=terraform.tfvars"

          # Terraform Plan for DESTROY
          - task: TerraformTaskV4@4
            displayName: "Terraform Plan (Destroy)"
            condition: and(succeeded(), eq('${{ parameters.action }}', 'destroy'))
            inputs:
              provider: "azurerm"
              command: "plan"
              workingDirectory: "$(workingDirectory)"
              environmentServiceNameAzureRM: "${{ variables.serviceConnection }}"
              commandOptions: "-destroy -var-file=terraform.tfvars"

  # ============================================================================
  # STAGE 2: MANUAL APPROVAL (Apply / Destroy se pehle review)
  # ============================================================================
  - stage: Approval
    displayName: "Manual Approval [${{ parameters.environment }} : ${{ parameters.action }}]"
    dependsOn: ScanAndPlan
    jobs:
      - job: WaitForApproval
        displayName: "Wait for Manual Approval"
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualValidation@0
            displayName: "Approve ${{ parameters.action }} for ${{ parameters.environment }}"
            timeoutInMinutes: 1440
            inputs:
              instructions: "ATTENTION: Action requested is '${{ parameters.action }}' on '${{ parameters.environment }}'. Please review Stage 1 logs (Plan & Security). Click 'Resume' to proceed with ${{ parameters.action }} or 'Reject' to abort."

  # ============================================================================
  # STAGE 3: TERRAFORM EXECUTE (Apply ya Destroy)
  # ============================================================================
  - stage: Execute
    displayName: "Terraform ${{ parameters.action }} [${{ parameters.environment }}]"
    dependsOn: Approval
    pool:
      vmImage: "ubuntu-latest"
    jobs:
      - job: TerraformExecute
        displayName: "Run Terraform ${{ parameters.action }}"
        steps:
          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: "latest"

          - task: TerraformTaskV4@4
            displayName: "Terraform Init"
            inputs:
              provider: "azurerm"
              command: "init"
              workingDirectory: "$(workingDirectory)"
              backendServiceArm: "${{ variables.serviceConnection }}"
              backendAzureRmResourceGroupName: "$(backendRG)"
              backendAzureRmStorageAccountName: "$(backendStorage)"
              backendAzureRmContainerName: "$(backendContainer)"
              backendAzureRmKey: "${{ parameters.environment }}.terraform.tfstate"

          # Execute Apply
          - task: TerraformTaskV4@4
            displayName: "Terraform Apply"
            condition: and(succeeded(), eq('${{ parameters.action }}', 'apply'))
            inputs:
              provider: "azurerm"
              command: "apply"
              workingDirectory: "$(workingDirectory)"
              environmentServiceNameAzureRM: "${{ variables.serviceConnection }}"
              commandOptions: "-var-file=terraform.tfvars"

          # Execute Destroy
          - task: TerraformTaskV4@4
            displayName: "Terraform Destroy"
            condition: and(succeeded(), eq('${{ parameters.action }}', 'destroy'))
            inputs:
              provider: "azurerm"
              command: "destroy"
              workingDirectory: "$(workingDirectory)"
              environmentServiceNameAzureRM: "${{ variables.serviceConnection }}"
              commandOptions: "-var-file=terraform.tfvars"

  # ============================================================================
  # STAGE 4: GMAIL STATUS NOTIFICATION (Success & Failure dono pe run hoga)
  # ============================================================================
  - stage: NotifyStatus
    displayName: "Gmail Notification [Success / Fail]"
    dependsOn:
      - ScanAndPlan
      - Approval
      - Execute
    condition: always()
    pool:
      vmImage: "ubuntu-latest"
    variables:
      scanStatus: $[ stageDependencies.ScanAndPlan.SecurityCostAndPlan.result ]
      approvalStatus: $[ stageDependencies.Approval.WaitForApproval.result ]
      execStatus: $[ stageDependencies.Execute.TerraformExecute.result ]
    jobs:
      - job: SendStatusEmail
        displayName: "Send Status Email to deepaknsn7@gmail.com"
        steps:
          - bash: |
              python3 scripts/notify_status.py
            displayName: "Send Gmail Notification"
            condition: always()
            env:
              SMTP_USER: $(SMTP_USER)
              SMTP_PASS: $(SMTP_PASS)
              RECIPIENT_EMAIL: "deepaknsn7@gmail.com"
              TARGET_ENV: "${{ parameters.environment }}"
              ACTION: "${{ parameters.action }}"
              STAGE_SCAN_STATUS: $(scanStatus)
              STAGE_APPROVAL_STATUS: $(approvalStatus)
              STAGE_EXECUTE_STATUS: $(execStatus)
              BUILD_ID: $(Build.BuildId)
              BUILD_URI: $(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)

