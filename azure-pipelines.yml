# ==============================================================================
# Azure DevOps Pipeline (Standard Task Assistant Format)
# Organization: pipelineagentic
# Project: Axion_project (https://dev.azure.com/pipelineagentic/Axion_project)
# Service Connection: Axion project
# Agent Pool: Microsoft-hosted (ubuntu-latest)
# Backend: Azure Blob Storage (Demo_rg_A / demostgab / democontainer)
# ==============================================================================

trigger: none
pr: none

parameters:
  - name: environment
    displayName: "Select Target Environment"
    type: string
    default: "dev"
    values:
      - dev
      - qa
      - prod

  - name: action
    displayName: "Select Terraform Action"
    type: string
    default: "plan"
    values:
      - plan
      - apply
      - destroy

pool:
  vmImage: "ubuntu-latest"

variables:
  serviceConnection: "Axion project"
  backendRG: "Demo_rg_A"
  backendStorage: "demostgab"
  backendContainer: "democontainer"
  # Target environment directory
  workingDirectory: "$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}"

steps:
  # 1. Install Terraform (Assistant Task: Terraform tool installer)
  - task: TerraformInstaller@1
    displayName: "Install Terraform"
    inputs:
      terraformVersion: "latest"

  # 2. Terraform Init (Assistant Task: Terraform)
  - task: TerraformTaskV4@4
    displayName: "Terraform Init [${{ parameters.environment }}]"
    inputs:
      provider: "azurerm"
      command: "init"
      workingDirectory: "$(workingDirectory)"
      backendServiceArm: "$(serviceConnection)"
      backendAzureRmResourceGroupName: "$(backendRG)"
      backendAzureRmStorageAccountName: "$(backendStorage)"
      backendAzureRmContainerName: "$(backendContainer)"
      backendAzureRmKey: "${{ parameters.environment }}.terraform.tfstate"

  # 3. Terraform Validate
  - task: TerraformTaskV4@4
    displayName: "Terraform Validate [${{ parameters.environment }}]"
    inputs:
      provider: "azurerm"
      command: "validate"
      workingDirectory: "$(workingDirectory)"

  # 4. Terraform Plan (Runs for 'plan' and 'apply')
  - task: TerraformTaskV4@4
    displayName: "Terraform Plan [${{ parameters.environment }}]"
    condition: and(succeeded(), in('${{ parameters.action }}', 'plan', 'apply'))
    inputs:
      provider: "azurerm"
      command: "plan"
      workingDirectory: "$(workingDirectory)"
      environmentServiceNameAzureRM: "$(serviceConnection)"
      commandOptions: "-var-file=terraform.tfvars"

  # 5. Terraform Apply (Runs only when action is 'apply')
  - task: TerraformTaskV4@4
    displayName: "Terraform Apply [${{ parameters.environment }}]"
    condition: and(succeeded(), eq('${{ parameters.action }}', 'apply'))
    inputs:
      provider: "azurerm"
      command: "apply"
      workingDirectory: "$(workingDirectory)"
      environmentServiceNameAzureRM: "$(serviceConnection)"
      commandOptions: "-var-file=terraform.tfvars"

  # 6. Terraform Destroy (Runs only when action is 'destroy')
  - task: TerraformTaskV4@4
    displayName: "Terraform Destroy [${{ parameters.environment }}]"
    condition: and(succeeded(), eq('${{ parameters.action }}', 'destroy'))
    inputs:
      provider: "azurerm"
      command: "destroy"
      workingDirectory: "$(workingDirectory)"
      environmentServiceNameAzureRM: "$(serviceConnection)"
      commandOptions: "-var-file=terraform.tfvars"
