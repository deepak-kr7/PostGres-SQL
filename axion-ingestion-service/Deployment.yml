apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-ingestion-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: axion-ingestion-service
  template:
    metadata:
      labels:
        app: axion-ingestion-service
    spec:
      containers:
      - name: axion-ingestion-service
        image: samaridhi123v2.azurecr.io/axion-ingestion-service:v1
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql://adminuser:Shivansh%40123@axion-pg-db-v2.postgres.database.azure.com:5432/axiondb"